{% extends "base.html" %}
{% block title %} - {{ heading }}{% endblock %}
{% block content %}
    <article>
      <header>{{ heading }}</header>
      <pre id="script-output" class="output">{{ output }}</pre>
      <a role="button"
         href="{{ request.url.path }}"
         hx-select="#script-output"
         hx-target="#script-output"
         hx-swap="outerHTML"
         hx-disabled-elt="this"
         class="secondary">Refresh</a>
    </article>
{% endblock %}
