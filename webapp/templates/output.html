<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ ssid }} — {{ heading }}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/site.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  {% include "_header.html" %}
  <main>
    <h2>{{ heading }}</h2>
    <pre>{{ output }}</pre>
  </main>
  <footer style="display: flex; gap: 0.75rem;">
    <a href="/" role="button" class="outline secondary">&larr; Back</a>
    <button hx-get="{{ request.url.path }}" hx-select="pre" hx-target="pre" hx-swap="outerHTML"
      hx-disabled-elt="this" class="outline secondary">
      Refresh
    </button>
  </footer>
</body>
</html>
