<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mnh-ap - Login</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  {% include "_header.html" %}
  <main>
    <div class="login-grid">
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="post" action="/login" class="field-row login-form" id="login-form">
        <label for="password">PassKey:</label>
        <input type="password" id="password" name="password" autofocus
          {% if error %}aria-invalid="true"{% endif %}>
        <a role="button" class="secondary" onclick="document.getElementById('login-form').requestSubmit()">Login</a>
      </form>
    </div>
  </main>
</body>
</html>
