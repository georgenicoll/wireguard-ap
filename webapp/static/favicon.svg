<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- branch -->
  <rect x="2" y="46" width="60" height="7" rx="3.5" fill="#8a5a2b"/>

  <!-- tail, curling under the branch -->
  <path d="M46 40 Q58 40 58 50 Q58 58 49 56" stroke="#5c3a1e" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- arms draped over the branch -->
  <path d="M20 34 Q16 44 20 50" stroke="#5c3a1e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M44 34 Q48 44 44 50" stroke="#5c3a1e" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- body, sitting on the branch -->
  <ellipse cx="32" cy="38" rx="14" ry="13" fill="#5c3a1e"/>

  <!-- ears, sticking out to the sides -->
  <circle cx="15" cy="20" r="7" fill="#5c3a1e"/>
  <circle cx="49" cy="20" r="7" fill="#5c3a1e"/>
  <circle cx="15" cy="20" r="3.6" fill="#e3b48c"/>
  <circle cx="49" cy="20" r="3.6" fill="#e3b48c"/>

  <!-- head -->
  <circle cx="32" cy="22" r="15" fill="#5c3a1e"/>

  <!-- face patch -->
  <ellipse cx="32" cy="27" rx="10" ry="11" fill="#e3b48c"/>

  <!-- eyes -->
  <circle cx="27" cy="22" r="2.6" fill="#1f140c"/>
  <circle cx="37" cy="22" r="2.6" fill="#1f140c"/>
  <circle cx="27.6" cy="21.2" r="0.8" fill="#fff"/>
  <circle cx="37.6" cy="21.2" r="0.8" fill="#fff"/>

  <!-- small nose and mouth -->
  <path d="M30 30 Q32 32 34 30" stroke="#1f140c" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M26 33 Q32 38 38 33" stroke="#1f140c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
</svg>
